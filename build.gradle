plugins {
    id 'java-library'
    id 'idea'
    // ModDevGradle — официальный Gradle-плагин NeoForge для разработки модов.
    // Если Gradle не примет динамическую версию, укажите точную, например '2.0.78' (см. https://projects.neoforged.net/neoforged/moddevgradle)
    id 'net.neoforged.moddev' version '2.0.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Запускается на GitHub: поднимает выделенный сервер с модом и сразу выключает его.
        // Проверяет, что мод загружается на сервере (реестры, конфиги, сеть) и не тянет клиентский код.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    // GeckoLib (https://github.com/bernie-g/geckolib/wiki/Installation)
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    // GeckoLib 4 для 1.21.1 (ветка 1.21.1 репозитория, требует NeoForge 21.1.150+). Только для компиляции:
    // в игре мод работает и без неё (сцена пробуждения тогда упрощённая), а с Iron's Spells она уже стоит.
    compileOnly("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}") { transitive = false }

    // Ядро мода не имеет жёстких зависимостей от Epic Fight и Iron's Spells:
    // интеграции изолированы в пакете compat и включаются только если мод установлен.

    // Vosk — офлайн-распознавание речи для голосовых команд (только клиент).
    // Встраивается внутрь jar мода (Jar-in-Jar), отдельно ставить ничего не нужно.
    // JNA не встраиваем: она уже входит в Minecraft.
    jarJar(implementation('com.alphacephei:vosk')) {
        version {
            strictly '[0.3.45,0.4)'
            prefer '0.3.45'
        }
        transitive = false
    }
}

// Для запуска runClient из среды разработки библиотека должна быть и на runtime classpath игры.
if (configurations.findByName('additionalRuntimeClasspath') != null) {
    dependencies.add('additionalRuntimeClasspath', 'com.alphacephei:vosk:0.3.45') { transitive = false }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
