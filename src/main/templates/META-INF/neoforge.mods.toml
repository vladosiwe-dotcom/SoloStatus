modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Iron's Spells 'n Spellbooks обязателен: магия, мана и заклинания Мага работают через него.
[[dependencies.${mod_id}]]
    modId="irons_spellbooks"
    type="required"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

# Необязательная интеграция: мод работает и без Epic Fight.
[[dependencies.${mod_id}]]
    modId="epicfight"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

# Better Combat конфликтует с Epic Fight по управлению атаками — не используйте их вместе.
